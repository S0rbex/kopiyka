name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous unfinished run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - run: ./mvnw -B verify

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bank-simulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/bank-simulator/go.mod
          # No third-party dependencies yet, so there is no go.sum to key the cache on
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
